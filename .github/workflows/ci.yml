name: CI Build & Deployment Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Verify Production Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run TypeScript type-check
        run: npx tsc --noEmit

      - name: Run Next.js production build
        run: npm run build
        env:
          DATABASE_URL: "mysql://root:password@localhost:3306/issue_tracker"
          NEXTAUTH_SECRET: "ci-test-secret-key-32-characters-minimum"
          NEXTAUTH_URL: "http://localhost:3000"
